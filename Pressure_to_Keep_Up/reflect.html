    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-2 text-[#D9777F] font-bold text-lg font-serif-title italic">

        <a href="index.html" class="nav-link px-3 py-1.5 rounded-full border border-transparent text-[#8C6A6E] hover:text-[#4A2A2E] transition">Home</a>

        <a href="pattern.html" class="nav-link px-3 py-1.5 rounded-full border border-transparent text-[#8C6A6E] hover:text-[#4A2A2E] transition">Pattern</a>

    </div>
  </header>

  <main class="max-w-3xl mx-auto px-6 py-12 flex-1">
    <span class="text-xs uppercase tracking-wider text-[#D9777F] font-semibold">04 · JOURNAL</span>
    <h1 class="text-3xl font-serif-title text-[#4A2A2E] mt-2 mb-6">Guided Journal Prompt</h1>

    <div class="bg-white p-6 rounded-3xl border border-[#F2D6D8] space-y-4">
      <label class="block text-sm font-semibold text-[#4A2A2E]">
        What is one personal progress metric that has nothing to do with social media recognition?
      </label>
      <textarea id="journal-input" rows="6" class="w-full p-4 rounded-2xl border border-[#F2D6D8] focus:outline-none focus:border-[#D9777F] text-xs text-[#4A2A2E]" placeholder="Write your thoughts here..."></textarea>
      <button onclick="saveJournal()" class="px-5 py-2 bg-[#D9777F] text-white text-xs font-semibold rounded-full hover:bg-[#A34850] transition">
        Save Journal Entry
      </button>
    </div>
  </main>

  <script>
    function saveJournal() {
      const txt = document.getElementById('journal-input').value;
      localStorage.setItem('reflection_journal', txt);
      alert('Journal entry saved locally!');
    }
  </script>
